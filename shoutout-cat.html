<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>🐾 Cat Shoutout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="assets/js/tmi.min.js"></script>
    <script src="assets/js/jquery-3.6.0.min.js"></script>
    <script src="assets/js/shoutout.js?cachebust=iQ8zG6oW1yA6yN7u"></script>
    <script src="assets/js/moment.min.js"></script>
    <script src="assets/js/cat-animations.js"></script>
    <link rel="stylesheet" href="assets/css/cat-theme.css">
</head>

<body>

<!-- Legacy container kept for compatibility (hidden) -->
<div id="container" style="display:none;"></div>

<!-- Floating paw print canvas -->
<canvas id="cat-paw-canvas"></canvas>

<!-- Walking cat animation -->
<div id="cat-walker">🐱</div>

<!-- New cat-themed shoutout card -->
<div id="shoutout-card">

    <!-- Cat ears on top of card -->
    <div class="cat-ears">
        <div class="cat-ear"></div>
        <div class="cat-ear"></div>
    </div>

    <div class="top-bar">
        <div class="top-bar-line"></div>
        <div class="top-bar-label">🐾 SHOUTOUT 🐾</div>
        <div class="top-bar-line"></div>
    </div>

    <div class="card-panel">

        <!-- VIDEO SECTION -->
        <div class="video-wrap">
            <video id="clip" autoplay playsinline></video>
            <img id="no-clip-avatar" class="hide" alt="channel avatar">
            <div class="video-overlay"></div>
            <div class="scanlines"></div>
            <div class="game-badge hide" id="game-badge"></div>

            <div class="no-clip-state hide" id="no-clip-state">
                <div class="no-clip-icon">🐾</div>
                <div class="no-clip-text">No Clip Available</div>
            </div>
        </div>

        <!-- PROGRESS BAR -->
        <div id="progress-bar-container" style="display:none;">
            <div id="progress-bar"></div>
        </div>

        <!-- INFO SECTION -->
        <div class="info-section">
            <div class="so-row">
                <div class="avatar-wrap">
                    <img id="channel-avatar" src="" alt="avatar">
                    <div class="avatar-ring"></div>
                </div>
                <div class="channel-info">
                    <div class="so-label">Shout Out</div>
                    <div id="channel-name">ChannelName</div>
                    <div class="twitch-url" id="twitch-url">twitch.tv/channelname</div>
                </div>
                <div class="follow-btn">FOLLOW 🐱</div>
            </div>
            <div class="info-divider"></div>
            <span class="clip-label" id="clip-label-text">NOW PLAYING</span>
            <div id="clip-title"></div>
            <div id="channel-desc"></div>
        </div>

    </div>
</div>

<!-- Card Picker Overlay -->
<div id="card-picker-overlay">
    <div class="picker-label">🐾 PICK A CLIP 🐾</div>
    <div id="picker-cards">

        <div class="picker-card" id="pcard-0">
            <div class="pcard-thumb"><img id="pthumb-0" src="" alt=""></div>
            <div class="pcard-info">
                <div class="pcard-num">01</div>
                <div class="pcard-title" id="ptitle-0"></div>
            </div>
        </div>

        <div class="picker-card" id="pcard-1">
            <div class="pcard-thumb"><img id="pthumb-1" src="" alt=""></div>
            <div class="pcard-info">
                <div class="pcard-num">02</div>
                <div class="pcard-title" id="ptitle-1"></div>
            </div>
        </div>

        <div class="picker-card" id="pcard-2">
            <div class="pcard-thumb"><img id="pthumb-2" src="" alt=""></div>
            <div class="pcard-info">
                <div class="pcard-num">03</div>
                <div class="pcard-title" id="ptitle-2"></div>
            </div>
        </div>

    </div>
</div>

<!-- Fake cursor for picker animation (cat paw cursor) -->
<div id="fake-cursor">
    <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Cat paw cursor -->
        <circle cx="18" cy="22" r="9" fill="#ff6eb4" opacity="0.9"/>
        <circle cx="11" cy="16" r="5" fill="#ff6eb4" opacity="0.85"/>
        <circle cx="25" cy="16" r="5" fill="#ff6eb4" opacity="0.85"/>
        <circle cx="7"  cy="24" r="4" fill="#ff6eb4" opacity="0.75"/>
        <circle cx="29" cy="24" r="4" fill="#ff6eb4" opacity="0.75"/>
        <!-- Toe beans -->
        <circle cx="14" cy="23" r="2.5" fill="#ff9ed3"/>
        <circle cx="22" cy="23" r="2.5" fill="#ff9ed3"/>
        <circle cx="18" cy="28" r="2.5" fill="#ff9ed3"/>
        <circle cx="18" cy="19" r="2.5" fill="#ff9ed3"/>
    </svg>
</div>

</body>
</html>
